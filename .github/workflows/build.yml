name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # build.py finds the x64 MSVC toolchain itself and runs the owned-process tests; no game is needed.
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build, test and package the runtime
        run: python -X utf8 -B release.py
      - uses: actions/upload-artifact@v7
        with:
          name: exanima-lua
          path: |
            dist/*.zip*
            dist/build.log
            dist/verification.json
          if-no-files-found: error
      # A push to main whose runtime version has no release yet tags v<version> and publishes it; later pushes
      # with the same version publish nothing. Bump VERSION in build.py to release again.
      - name: Release a new version
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content dist/mods/com.necrosis.script-runtime/manifest.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version = "([^"]+)"').Groups[1].Value
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag is already released"; exit 0 }
          $assets = Get-ChildItem dist -File -Filter 'ExanimaLua-*.zip*' | ForEach-Object FullName
          $flags = @('--target', $env:GITHUB_SHA, '--title', "Exanima Lua Runtime $tag", '--generate-notes', '--latest=false')
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
